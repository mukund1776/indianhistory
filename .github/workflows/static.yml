
name: Deploy Indian History to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Download repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Angular for GitHub Pages
      - name: Build application
        run: npm run build -- --base-href /indianhistory/

      # 5. Handle Angular client-side routing
      - name: Create SPA fallback
        run: |
          cp dist/hello-world/browser/index.html \
             dist/hello-world/browser/404.html

      # 6. Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 7. Upload compiled website
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/hello-world/browser'

      # 8. Deploy to GitHub Pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
