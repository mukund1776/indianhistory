@if (book; as item) {
  <aside class="book-sidebar card" [class.affiliate-pending]="!item.affiliateUrl" aria-labelledby="page-book-title">
    <p class="eyebrow">Book recommendation</p>
    @if (!item.affiliateUrl) {
      <p class="affiliate-status">Affiliate link pending · Regular Amazon.in link</p>
    }
    <a class="book-sidebar-cover" [href]="item.affiliateUrl || item.amazonUrl" target="_blank" [attr.rel]="item.affiliateUrl ? 'sponsored noopener' : 'noopener'">
      <img [appLazyImage]="item.imageUrl" [alt]="item.imageAlt" decoding="async" />
    </a>
    <p class="book-meta">{{ item.category }} · {{ item.format }}</p>
    <h2 id="page-book-title">
      <a [href]="item.affiliateUrl || item.amazonUrl" target="_blank" [attr.rel]="item.affiliateUrl ? 'sponsored noopener' : 'noopener'">{{ item.title }}</a>
    </h2>
    <p class="book-author">by {{ item.author }}</p>
    <a class="read-more" [href]="item.affiliateUrl || item.amazonUrl" target="_blank" [attr.rel]="item.affiliateUrl ? 'sponsored noopener' : 'noopener'">View on Amazon.in →</a>
  </aside>
}
